name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Check Markdown links (offline)
        run: python tools/check_links.py .
      - name: Lint filled example checklists
        run: python tools/checklist_lint.py examples/go-no-go.md examples/rollout.md examples/review-checklist.md
      - name: Release gate on example results
        run: python tools/release_gate.py examples/eval-results.json
